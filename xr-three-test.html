<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three.js XR comparison v2</title>
<style>body{font:16px system-ui;background:#162535;color:white;padding:20px;max-width:640px;margin:auto}button,select{font:inherit;padding:10px;margin:5px}pre{white-space:pre-wrap}canvas{width:100%;height:180px}</style>
<h1>Three.js XR comparison v2</h1><p>Та же сцена, что в Raw WebXR v2: 24 столбика, сетка на полу с шагом 1 м, 20°/с. Сядьте перед тестом.</p>
<label>Hz <select id="hz"><option>72</option><option selected>90</option><option>120</option></select></label>
<label>Motion <select id="motion"><option value="world">WORLD</option><option value="rig">RIG</option><option value="static">STATIC</option></select></label>
<label>MSAA <select id="aa"><option value="0">OFF</option><option value="1">ON</option></select></label>
<button id="go" disabled>Enter VR</button><pre id="out">Loading Three.js…</pre>
<p>A/X — WORLD → RIG → STATIC. B/Y — следующая частота. MSAA меняется перед входом. После выхода — статистика.</p>
<script type="module">
const el=id=>document.getElementById(id),out=el('out');
try {
const T=await import('https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js');
const scene=new T.Scene();scene.background=new T.Color().setRGB(.64,.77,.87,T.SRGBColorSpace);
const world=new T.Group(),rig=new T.Group();scene.add(world,rig);
const camera=new T.PerspectiveCamera(75,1,.05,60);rig.add(camera);
// Match raw test: single vertex-color mesh, 25 boxes, identical shading.
const vertices=[],colors=[];
function box(x,y,z,w,h,d,color){
 const a=w/2,b=h/2,e=d/2,v=[[-a,-b,-e],[a,-b,-e],[a,b,-e],[-a,b,-e],[-a,-b,e],[a,-b,e],[a,b,e],[-a,b,e]];
 const faces=[[0,1,2,0,2,3],[5,4,7,5,7,6],[4,0,3,4,3,7],[1,5,6,1,6,2],[3,2,6,3,6,7],[4,5,1,4,1,0]];
 faces.forEach((f,i)=>f.forEach(k=>{const q=v[k],shade=i===4?1:i%2?.75:.9;vertices.push(x+q[0],y+q[1],z+q[2]);const c=new T.Color().setRGB(...color.map(t=>t*shade),T.SRGBColorSpace);colors.push(c.r,c.g,c.b);}));
}
for(let i=0;i<24;i++){const a=i*Math.PI/12;box(9*Math.cos(a),0,9*Math.sin(a),.55,3,.55,i%3===0?[.95,.66,.18]:[.12,.25,.39]);}box(0,-1.6,0,40,.1,40,[.38,.43,.45]);
const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(vertices,3));g.setAttribute('color',new T.Float32BufferAttribute(colors,3));
world.add(new T.Mesh(g,new T.MeshBasicMaterial({vertexColors:true,side:T.DoubleSide,toneMapped:false})));
const grid=new T.GridHelper(40,40,0xe8e8e8,0x263b49);grid.position.y=-1.545;world.add(grid);
let renderer=null,session=null,mode='world',angle=0,last=null,count=0,total=0,max=0,long=0,heldA=false,heldB=false,busy=false,report='',rateAtStart=0;
function reset(){last=null;count=total=max=long=0;rateAtStart=session?.frameRate||0;}
function summary(){return mode.toUpperCase()+' | '+(rateAtStart||'?')+' Hz | callbacks '+count+' | mean '+(count?total/count:0).toFixed(2)+' ms | max '+max.toFixed(2)+' ms | >1.5 periods '+long;}
async function rate(hz){if(!session||busy)return;busy=true;try{if(session.updateTargetFrameRate&&Array.from(session.supportedFrameRates||[]).includes(hz))await session.updateTargetFrameRate(hz);else report+='\nRequested rate not supported: '+hz;}catch(e){report+='\n'+e.message;}finally{busy=false;}}
function loop(t){
 if(!session)return;
 let a=false,b=false;for(const src of session.inputSources){a||=!!src.gamepad?.buttons[4]?.pressed;b||=!!src.gamepad?.buttons[5]?.pressed;}
 if(a&&!heldA){report+='\n'+summary();mode=['world','rig','static'][(['world','rig','static'].indexOf(mode)+1)%3];reset();}
 if(b&&!heldB){const rates=[72,90,120].filter(x=>Array.from(session.supportedFrameRates||[]).includes(x));if(rates.length)rate(rates[(rates.indexOf(session.frameRate)+1)%rates.length]);}
 heldA=a;heldB=b;
 const dt=last===null?0:t-last;const period=1000/(session.frameRate||90);
 if(last!==null){count++;total+=dt;max=Math.max(max,dt);if(dt>1.5*period)long++;}
 last=t;if(mode!=='static')angle+=dt*Math.PI/9000;
 // Same apparent turn in both modes: inverse camera rotation vs world rotation.
 world.rotation.y=mode==='rig'?0:angle;rig.rotation.y=mode==='rig'?-angle:0;
 renderer.render(scene,camera);
}
el('go').disabled=false;out.textContent='Ready · Three.js r'+T.REVISION;
el('go').onclick=async()=>{
 if(session)return;
 try{
 if(!navigator.xr)throw Error('WebXR unavailable');
 if(renderer){renderer.dispose();renderer.domElement.remove();}
 renderer=new T.WebGLRenderer({antialias:el('aa').value==='1',alpha:false});
 renderer.setSize(320,180);renderer.xr.enabled=true;renderer.xr.setReferenceSpaceType('local');renderer.xr.setFramebufferScaleFactor(1);
 document.body.appendChild(renderer.domElement);
 session=await navigator.xr.requestSession('immersive-vr');
 const current=session;
 el('go').disabled=true;mode=el('motion').value;angle=0;heldA=heldB=false;report='MSAA requested '+el('aa').value;reset();
 current.addEventListener('end',()=>{out.textContent=report+'\n'+summary();renderer.setAnimationLoop(null);session=null;el('go').disabled=false;});
 current.addEventListener('frameratechange',()=>{report+='\n'+summary();reset();});
 await renderer.xr.setSession(current);
 renderer.setAnimationLoop(loop);rate(Number(el('hz').value));
 out.textContent='Running';
 }catch(e){report+='\nError: '+e.message;out.textContent=report;if(session)await session.end().catch(()=>{});session=null;el('go').disabled=false;}
};
}catch(e){out.textContent='Error: '+e.message;}
</script></html>
