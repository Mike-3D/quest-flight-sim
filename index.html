<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#83c6f4">
  <title>Quest Flight Sim · v0.6.1</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; overflow:hidden; background:#86c8f3; font-family:system-ui,-apple-system,sans-serif; color:#fff; }
    #hud { position:fixed; top:12px; left:12px; z-index:3; padding:12px 15px; max-width:min(390px,80vw); background:#10243acb; border:1px solid #ffffff40; border-radius:12px; font-size:13px; line-height:1.45; pointer-events:none; }
    #hud h1 { font-size:17px; margin:0 0 5px; }
    #hud p { margin:4px 0; }
    #message { color:#ffdb87; }
    #reset { position:fixed; bottom:20px; left:16px; z-index:4; background:#19344d; color:white; border:1px solid #ffffff88; border-radius:8px; padding:10px 14px; font-size:14px; }
    #hud.hidden { display:none; }
    #VRButton { z-index:6 !important; }
    @media(max-width:600px) { #hud { font-size:11px; max-width:72vw; } #hud h1 { font-size:14px; } }
  </style>
</head>
<body>
  <div id="hud">
    <h1>✈ Quest Flight Sim <small>v0.6.1</small></h1>
    <p id="flight">Скорость: 0 · Высота: 0</p>
    <p id="input">Стики: ожидание контроллеров</p>
    <p>Quest 3: правый стик — поворот и тангаж, левый стик вверх/вниз — газ. Кнопка A/X — сброс.</p>
    <p>ПК: WASD / стрелки — управление, W/S с Shift — газ, R — сброс.</p>
    <p id="message"></p>
  </div>
  <button id="reset" type="button">↺ Сброс</button>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js"}}</script>
  <script type="module" src="./main.js?v=0.6.1"></script>
</body>
</html>
