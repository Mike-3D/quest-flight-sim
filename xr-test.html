<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raw WebXR motion test 2</title>
<style>body{font:16px system-ui;background:#162535;color:#fff;padding:20px;max-width:640px;margin:auto}button,select{font:inherit;padding:12px;margin:5px}pre{white-space:pre-wrap}canvas{width:100%;height:100px}</style>
<h1>Raw WebXR motion test v2</h1>
<p>Без Three.js. Неподвижные столбики, автоматический поворот 20°/с. Сядьте перед тестом.</p>
<label>Частота <select id="hz"><option>72</option><option selected>90</option><option>120</option></select></label>
<label>Режим <select id="mode"><option value="time">TIME</option><option value="step">STEP</option><option value="still">STATIC</option></select></label>
<button id="go">Enter VR</button><pre id="status">Ready</pre><canvas id="c" width="32" height="32"></canvas>
<p>В VR: A/X — TIME / STEP / STATIC; B/Y — следующая поддерживаемая частота. После выхода отображается статистика интервалов кадров. Для остановки используйте системную кнопку.</p>
<script>
'use strict';
const el=id=>document.getElementById(id), output=el('status');
let rendered=0,poses=0,callbacks=0,frameError='';
let session=null,gl,program,buffer,loc,ref,layer,mode='time',angle=0,last=null,first=null,count=0,total=0,max=0,long=0,held=[false,false],busy=false,report='';
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
function init(){
 gl=el('c').getContext('webgl',{xrCompatible:true,antialias:true,alpha:false});
 if(!gl)throw Error('WebGL unavailable');
 program=gl.createProgram();
 gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec3 p; attribute vec3 c; uniform mat4 vp; varying vec3 color; void main(){gl_Position=vp*vec4(p,1.0);color=c;}'));
 gl.attachShader(program,shader(gl.FRAGMENT_SHADER,'precision mediump float; varying vec3 color; void main(){gl_FragColor=vec4(color,1.0);}'));
 gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
 const vertices=[];
 function box(x,y,z,w,h,d,color){
  const a=w/2,b=h/2,e=d/2;
  const v=[[-a,-b,-e],[a,-b,-e],[a,b,-e],[-a,b,-e],[-a,-b,e],[a,-b,e],[a,b,e],[-a,b,e]];
  const faces=[[0,1,2,0,2,3],[5,4,7,5,7,6],[4,0,3,4,3,7],[1,5,6,1,6,2],[3,2,6,3,6,7],[4,5,1,4,1,0]];
  faces.forEach((f,i)=>f.forEach(k=>{const q=v[k],shade=i===4?1:i%2?.75:.9;vertices.push(x+q[0],y+q[1],z+q[2],...color.map(t=>t*shade));}));
 }
 for(let i=0;i<24;i++){const a=i*Math.PI/12;box(9*Math.cos(a),0,9*Math.sin(a),.55,3,.55,i%3===0?[.95,.66,.18]:[.12,.25,.39]);}
 box(0,-1.6,0,40,.1,40,[.38,.43,.45]);
 buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vertices),gl.STATIC_DRAW);
 loc={p:gl.getAttribLocation(program,'p'),c:gl.getAttribLocation(program,'c'),vp:gl.getUniformLocation(program,'vp'),n:vertices.length/6};
 gl.enable(gl.DEPTH_TEST);
}
const mv=new Float32Array(16),vp=new Float32Array(16),rot=new Float32Array(16);
function mul(out,a,b){for(let j=0;j<4;j++)for(let i=0;i<4;i++)out[j*4+i]=a[i]*b[j*4]+a[4+i]*b[j*4+1]+a[8+i]*b[j*4+2]+a[12+i]*b[j*4+3];}
function resetStats(){last=null;first=null;count=0;total=0;max=0;long=0;}
function summarize(){return mode.toUpperCase()+' | '+(session?.frameRate||'?')+' Hz | callbacks '+count+' | mean '+(count?total/count:0).toFixed(2)+' ms | max '+max.toFixed(2)+' ms | >1.5 periods '+long;}
async function rate(hz){if(!session||busy)return;busy=true;try{if(session.updateTargetFrameRate&&Array.from(session.supportedFrameRates||[]).includes(hz))await session.updateTargetFrameRate(hz);}catch(e){report+='\nRate: '+e.message;}finally{busy=false;}}
function controls(){
 let a=false,b=false;for(const s of session.inputSources){a||=!!s.gamepad?.buttons[4]?.pressed;b||=!!s.gamepad?.buttons[5]?.pressed;}
 if(a&&!held[0]){report+='\n'+summarize();mode=['time','step','still'][(['time','step','still'].indexOf(mode)+1)%3];resetStats();}
 if(b&&!held[1]){const r=[72,90,120].filter(v=>Array.from(session.supportedFrameRates||[]).includes(v));if(r.length)rate(r[(r.indexOf(session.frameRate)+1)%r.length]);}
 held=[a,b];
}
function frame(t,f){
 if(!session)return;
 callbacks++;
 session.requestAnimationFrame(frame);
 try{
 controls();
 const dt=last===null?0:t-last,period=1000/(session.frameRate||90);
 if(last!==null){count++;total+=dt;max=Math.max(max,dt);if(dt>period*1.5)long++;}
 last=t;if(first===null)first=t;
 if(mode!=='still')angle+=(mode==='step'?(dt?period:0):dt)*Math.PI/9000;
 const activeLayer=session.renderState.baseLayer;if(!activeLayer)return;
 gl.bindFramebuffer(gl.FRAMEBUFFER,activeLayer.framebuffer);
 gl.disable(gl.SCISSOR_TEST);gl.colorMask(true,true,true,true);gl.depthMask(true);
 gl.clearColor(.64,.77,.87,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 const pose=f.getViewerPose(ref);if(!pose)return;poses++;
 gl.useProgram(program);gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
 gl.enableVertexAttribArray(loc.p);gl.vertexAttribPointer(loc.p,3,gl.FLOAT,false,24,0);
 gl.enableVertexAttribArray(loc.c);gl.vertexAttribPointer(loc.c,3,gl.FLOAT,false,24,12);
 const c=Math.cos(angle),s=Math.sin(angle);
 rot.set([c,0,-s,0,0,1,0,0,s,0,c,0,0,0,0,1]);
 for(const v of pose.views){const r=activeLayer.getViewport(v);gl.viewport(r.x,r.y,r.width,r.height);
  mul(mv,v.transform.inverse.matrix,rot);mul(vp,v.projectionMatrix,mv);
  gl.uniformMatrix4fv(loc.vp,false,vp);gl.drawArrays(gl.TRIANGLES,0,loc.n);
 }
 rendered++;
 }catch(e){frameError=String(e);session.end().catch(()=>{});}
}
el('go').onclick=async()=>{
 if(session)return;
 try{
  if(!navigator.xr)throw Error('WebXR unavailable');
  session=await navigator.xr.requestSession('immersive-vr');
  const current=session;
  current.addEventListener('end',()=>{output.textContent=report+'\n'+summarize()+'\nCallbacks: '+callbacks+' / poses: '+poses+' / rendered: '+rendered+'\n'+frameError;session=null;el('go').disabled=false;});
  el('go').disabled=true;report='';callbacks=poses=rendered=0;frameError='';mode=el('mode').value;angle=0;held=[false,false];resetStats();
  if(!gl)init();await gl.makeXRCompatible();
  layer=new XRWebGLLayer(current,gl,{framebufferScaleFactor:1,antialias:false,alpha:false,depth:true});
  current.updateRenderState({baseLayer:layer,depthNear:.05,depthFar:60});
  ref=await current.requestReferenceSpace('local');
  current.addEventListener('frameratechange',()=>{report+='\n'+summarize();resetStats();});
  output.textContent='Running';current.requestAnimationFrame(frame);
  rate(Number(el('hz').value));
 }catch(e){frameError=String(e);output.textContent=frameError;if(session)await session.end().catch(()=>{});session=null;el('go').disabled=false;}
};
</script></html>
